[project]
name = "monochrome"
version = "0.1.0"
description = "Turn photographs into monochrome paint-by-numbers templates."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "reportlab>=4.0",
    "typer>=0.12",
]

[project.scripts]
monochrome = "monochrome.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monochrome"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.black]
line-length = 100
target-version = ["py311"]
